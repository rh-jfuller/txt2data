[package]
name = "txt2data"
version = "0.7.0"
edition = "2024"
description = "Convert any text to JSON, XML, YAML, SQL, or S-expressions using ixml grammars"
license = "MIT"
repository = "https://github.com/rh-jfuller/txt2data"
homepage = "https://rh-jfuller.github.io/txt2data/"
readme = "README.md"
keywords = ["parser", "ixml", "json", "xml", "grammar"]
categories = ["command-line-utilities", "parser-implementations", "encoding"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "txt2data"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "txt2data"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:clap"]
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde_json"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
unicode-general-category = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[package.metadata.generate-rpm]
assets = [{ source = "target/release/txt2data", dest = "/usr/bin/txt2data", mode = "0755" }]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"
